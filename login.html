<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — LYRIA</title>
  <meta name="description" content="Sign in to LYRIA and return to your conversations.">
  <link rel="stylesheet" href="css/main.css">
  
  <!-- Firebase CDN Links -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  
  <!-- Utility Scripts -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  
  <style>
    /* Glassmorphism styling */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-family: Arial, sans-serif; 
      background: url('assets/background.png') no-repeat center center fixed; 
      background-size: cover; 
      color: #ffffff;
    }
    .wrapper { 
      width: 100%; 
      max-width: 400px; 
      padding: 2rem; 
      background: rgba(255, 255, 255, 0.2); /* Glass effect */
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); 
      border-radius: 8px; 
      text-align: center; 
      backdrop-filter: blur(10px); /* Blur for glass effect */
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    h2 { margin-bottom: 1rem; color: #fff; }
    .google-button, .guest-button { 
      width: 100%; 
      padding: 0.75rem; 
      font-weight: bold; 
      color: #ffffff; 
      border: none; 
      cursor: pointer; 
      border-radius: 4px; 
      transition: background-color 0.3s; 
      margin-top: 1rem;
    }
    .google-button { background-color: #db4437; }
    .google-button:hover { background-color: #c33b2e; }
    .guest-button { background-color: #3c3f42; }
    .guest-button:hover { background-color: #2f3236; }
    #error-message { color: red; font-size: 0.9rem; margin-top: 1rem; }
    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      font-size: 0.9em;
      color: #ffffff; /* White text */
      background-color: transparent;
      padding: 1rem 0;
    }

    .modal {
        display: none; /* Hidden by default */
        position: fixed; /* Stay in place */
        z-index: 1000; /* Sit on top */
        left: 0;
        top: 0;
        width: 100%; /* Full width */
        height: 100%; /* Full height */
        overflow: auto; /* Enable scroll if needed */
        background-color: rgb(0,0,0); /* Fallback color */
        background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
    }

    .modal-content {
        background-color: #fefefe;
        margin: 15% auto; /* 15% from the top and centered */
        padding: 20px;
        border: 1px solid #888;
        width: 80%; /* Could be more or less, depending on screen size */
    }

    /* Notification styling */
    #notification {
      display: none; /* Hidden by default */
      background-color: rgba(255, 255, 0, 0.8); /* Yellow background */
      color: black;
      padding: 10px;
      border-radius: 5px;
      margin-top: 20px;
      text-align: center;
      position: relative;
      z-index: 1000; /* Sit on top */
    }
  </style>
  <link rel="stylesheet" href="css/lyria-v6.css">
</head>
<body class="login-page" onload="document.getElementById('notification').style.display = 'block'">
  <div class="wrapper">
    <h2>Good to see you.</h2>
    <button id="google-signin" class="google-button">Continue with Google</button>
    <button id="guest-login" class="guest-button">Explore as a guest</button>
    <p id="error-message"></p>
    <div id="notification">A little housekeeping: older inactive channels may be cleared periodically to keep LYRIA running smoothly.</div>
  </div>

  <script>
    // Load environment variables for security
    // In production, these should be loaded from a secure source
    window.env = window.env || {
      VITE_FIREBASE_API_KEY: "AIzaSyDWpApnJ-mfHQJZhkbNDdsJ7l8-8rVHHTc",
      VITE_FIREBASE_AUTH_DOMAIN: "lyria-49a54.firebaseapp.com",
      VITE_FIREBASE_PROJECT_ID: "lyria-49a54",
      VITE_FIREBASE_STORAGE_BUCKET: "lyria-49a54.firebasestorage.app",
      VITE_FIREBASE_MESSAGING_SENDER_ID: "704449928785",
      VITE_FIREBASE_APP_ID: "1:704449928785:web:5b3c58c8f82d31d3f1a270",
      VITE_FIREBASE_MEASUREMENT_ID: "G-KV5FRFN63T"
    };

    // Initialize Firebase for login page
    function initializeLoginFirebase() {
        if (window.firebaseConfig && window.firebaseConfig.initialized) {
            return window.firebaseConfig.getAuth();
        }

        // If config is available but not initialized, initialize it
        if (window.firebaseConfig) {
            window.firebaseConfig.initialize();
            return window.firebaseConfig.getAuth();
        }

        // Fallback: initialize directly if config.js wasn't loaded
        const fallbackConfig = {
            apiKey: window.env.VITE_FIREBASE_API_KEY,
            authDomain: window.env.VITE_FIREBASE_AUTH_DOMAIN,
            projectId: window.env.VITE_FIREBASE_PROJECT_ID,
            storageBucket: window.env.VITE_FIREBASE_STORAGE_BUCKET,
            messagingSenderId: window.env.VITE_FIREBASE_MESSAGING_SENDER_ID,
            appId: window.env.VITE_FIREBASE_APP_ID,
            measurementId: window.env.VITE_FIREBASE_MEASUREMENT_ID
        };
        firebase.initializeApp(fallbackConfig);
        return firebase.auth();
    }

    const auth = initializeLoginFirebase();

    // Initialize Firestore
    function getFirestore() {
        if (window.firebaseConfig && window.firebaseConfig.initialized) {
            return window.firebaseConfig.getFirestore();
        }
        return firebase.firestore();
    }

    const db = getFirestore();

    async function ensurePersonalWorkspace(user, role) {
      const personalChannelId = `personal-${user.uid}`;
      const userRef = db.collection('users').doc(user.uid);
      const channelRef = db.collection('channels').doc(personalChannelId);
      const userDoc = await userRef.get();

      if (!userDoc.exists) {
        await userRef.set({
          displayName: user.displayName || (role === 'guest' ? 'Guest' : 'User'),
          email: user.email || null,
          photoURL: user.photoURL || 'assets/icon.png',
          role,
          channels: [personalChannelId],
          friends: [],
          badges: [],
          darkMode: false,
          notificationsEnabled: false,
          bio: 'No bio set.'
        });
      } else {
        await userRef.set({
          channels: firebase.firestore.FieldValue.arrayUnion(personalChannelId)
        }, { merge: true });
      }

      const channelDoc = await channelRef.get();
      if (!channelDoc.exists) {
        await channelRef.set({
          name: 'My Personal Channel',
          id: personalChannelId,
          createdBy: user.uid,
          joinCode: Math.random().toString(36).substring(2, 8).toUpperCase(),
          members: [user.uid],
          isPublic: false
        });
      } else {
        await channelRef.update({
          members: firebase.firestore.FieldValue.arrayUnion(user.uid)
        });
      }
    }

    // Google Sign-In Button Event
    document.getElementById('google-signin').addEventListener('click', function() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(async result => {
          await ensurePersonalWorkspace(result.user, 'user');
          window.location.href = 'home.html';
        })
        .catch(error => {
          document.getElementById('error-message').textContent = error.message;
        });
    });

    // Guest Login Button Event
    document.getElementById('guest-login').addEventListener('click', function() {
      auth.signInAnonymously()
        .then(async result => {
          await ensurePersonalWorkspace(result.user, 'guest');
          window.location.href = 'home.html';
        })
        .catch(error => {
          document.getElementById('error-message').textContent = error.message;
        });
    });

    // Close the welcome modal
    // (deferred to DOMContentLoaded because this <script> runs before the
    // modal markup further down the page has been parsed)
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('close-welcome-modal').addEventListener('click', () => {
        document.getElementById('welcome-modal').style.display = 'none';
      });
    });

    // Auto-hide notification after 5 seconds
    setTimeout(() => {
      document.getElementById('notification').style.display = 'none';
    }, 5000);
  </script>

  <footer>
    &copy; 2024 LYRIA. All rights reserved. Trademarked by LYRIA.
  </footer>

  <div id="welcome-modal" class="modal" aria-hidden="true" role="dialog" aria-labelledby="welcome-modal-title">
    <div class="modal-content">
        <h2 id="welcome-modal-title">Welcome!</h2>
        <p>You've received a Beta Tester badge for signing up early!</p>
        <button id="close-welcome-modal" class="close-button" aria-label="Close Welcome Modal">&times;</button>
    </div>
  </div>
</body>
</html>
