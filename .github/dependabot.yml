version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/tests", "/LYRIA", "/LYRIA/vendor/expo-merge-adapter"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
# Updates require maintainer review. No automatic approval, merge, or deployment.

  - package-ecosystem: pip
    directory: /tests
    schedule: {interval: weekly}
    groups:
      python-tests:
        patterns: ["*"]
