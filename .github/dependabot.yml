version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    groups:
      web-tooling:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /tests
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    groups:
      test-platform:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /LYRIA
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    groups:
      mobile-platform:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /tests
    schedule: {interval: weekly}
    groups:
      python-tests:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ["*"]
# Updates are proposals. No auto-merge, approval, or deployment is configured.
