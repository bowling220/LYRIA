name: LYRIA CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lyria-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  LYRIA_ENV: development
jobs:
  web:
    name: Website and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm ci --prefix tests
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y coturn
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-screenshots
          path: test-artifacts/**/*.png
          retention-days: 5
          if-no-files-found: ignore
  firestore:
    name: Firestore authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix tests
      - run: npm run test:rules
  dependencies:
    name: Dependency audit (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', tests]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
  security:
    name: Secret and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python scripts/install-ci-tools.py
      - run: .ci-tools/actionlint -color
      - run: python scripts/check-ci-safety.py
      - run: .ci-tools/gitleaks git . --log-opts=--all --redact --no-banner --report-format json --report-path .ci-tools/secret-findings.json
      - name: Summarize secret scan without exposing matched values
        if: always()
        run: python scripts/report-secret-findings.py .ci-tools/secret-findings.json
  result:
    name: CI result
    if: always()
    needs: [web, firestore, dependencies, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json,os,sys
          results=json.loads(os.environ['RESULTS'])
          failed=[name for name,value in results.items() if value['result']!='success']
          if failed:
              print('Required checks did not succeed: '+', '.join(failed))
              sys.exit(1)
          print('All required checks passed. This does not authorize deployment.')
          PY
