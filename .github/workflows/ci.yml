name: LYRIA CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lyria-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  LYRIA_ENV: development
  EXPO_NO_TELEMETRY: '1'
jobs:
  web:
    name: Website and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm ci --prefix tests
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y coturn
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-screenshots
          path: test-artifacts/**/*.png
          retention-days: 5
          if-no-files-found: ignore
  firestore:
    name: Firestore authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix tests
      - run: npm run test:rules
  mobile:
    name: Expo compatibility and exports
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: LYRIA
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check:expo
      - run: npm run doctor
      - run: npm run build:check
      - run: npm run build:web
  dependencies:
    name: Dependency audit (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', tests, LYRIA]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
  security:
    name: Secret and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python scripts/install-ci-tools.py
      - run: .ci-tools/actionlint -color
      - run: python scripts/check-ci-safety.py
      - run: .ci-tools/gitleaks git . --log-opts=--all --redact --no-banner --report-format json --report-path .ci-tools/secret-findings.json
      - name: Summarize secret scan without exposing matched values
        if: always()
        run: python scripts/report-secret-findings.py .ci-tools/secret-findings.json
  result:
    name: CI result
    if: always()
    needs: [web, firestore, mobile, dependencies, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json,os,sys
          results=json.loads(os.environ['RESULTS'])
          failed=[name for name,value in results.items() if value['result']!='success']
          if failed:
              print('Required checks did not succeed: '+', '.join(failed))
              sys.exit(1)
          print('All required checks passed. This does not authorize deployment.')
          PY
