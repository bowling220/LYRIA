name: Dependency security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit-and-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix tests
      - run: npm ci --prefix LYRIA
      - name: Audit every dependency tree, including development dependencies
        run: |
          npm audit --audit-level=low
          npm audit --prefix tests --audit-level=low
          npm audit --prefix LYRIA --audit-level=low
      - run: npm run build
      - run: npm test
      - run: npm run test:dependencies
      - run: npm run test:rules
      - run: npm run check:expo --prefix LYRIA
      - run: npm run doctor --prefix LYRIA
      - name: Validate mobile bundles
        working-directory: LYRIA
        run: npx expo export --platform ios --platform android --platform web --output-dir dist-security --max-workers 2
# No pull_request_target, secrets, deploy hooks, write token, or production deployment.
