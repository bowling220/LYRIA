<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>You’re invited — LYRIA</title>
  <meta name="description" content="A little closer starts with an invitation. Join your people on LYRIA.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/theme.css?v=122ad9ff506da701">
  <script src="js/ui.js?v=68d81812cba5f6c2"></script><script src="js/appearance.js?v=f2b3fb9699b59da3"></script>
  <script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore-compat.js"></script>
  <script src="js/runtime-config.js?v=2d5215ca595a64fe"></script>
        <script src="js/config.js?v=0c88e1ace284ae8f"></script><script src="js/invites.js?v=23abf220b9d0b3bd"></script>
  <script src="js/invite-page.js?v=e979f46de10905ec" defer></script>
</head>
<body class="invite-page">
  <header class="site-header"><a class="brand" href="home.html?view=hub" aria-label="LYRIA home"><span class="brand-mark"><span data-icon="chat" aria-hidden="true"></span></span>LYRIA</a><span class="text-link">A little closer.</span></header>
  <main class="invite-main">
    <div class="invite-orbit" aria-hidden="true"><span data-icon="chat"></span><span data-icon="hash"></span><span data-icon="mic"></span></div>
    <section class="invite-card" aria-labelledby="invite-title" aria-busy="true">
      <div class="invite-art" aria-hidden="true"><span class="invite-thread"></span><span data-icon="chat"></span><span class="invite-spark">✦</span></div>
      <p class="page-kicker">There’s a place for you here</p>
      <h1 id="invite-title">You’re invited.</h1>
      <p id="invite-description">Conversations, shared moments, and your next favorite people.</p>
      <p id="invite-status" role="status" aria-live="polite">Checking your invitation…</p>
      <button id="accept-invite" class="primary-action" disabled>Loading…</button>
      <p class="invite-fineprint">Joining is your choice. Your microphone stays off.</p>
      <a class="text-link" href="home.html?view=hub">Back to LYRIA</a>
    </section>
    <p class="invite-signoff">Your people. Your corner of the internet.</p>
  </main>
</body>
</html>
