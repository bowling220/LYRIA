<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Inbox — LYRIA</title>
    <meta name="description" content="Review and respond to your LYRIA friend requests.">
    <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>
    <script src="js/config.js"></script>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/theme.css">
  <script src="js/ui.js"></script>
</head>
<body class="inbox-page">
    <header class="top-header"><a class="brand" href="index.html" aria-label="LYRIA home"><span class="brand-mark"><span data-icon="chat" aria-hidden="true"></span></span><span>LYRIA</span></a><span class="header-divider" aria-hidden="true"></span><span class="header-location">Inbox</span><nav class="header-nav" aria-label="Main navigation"><a class="" href="home.html">Community</a><a class="news-link" href="News.html">News</a><a class="nav-premium" href="premium-upgrade.html">Premium</a></nav></header>
    <main class="inbox-area"><div class="page-heading"><span class="page-kicker">Your people, a little closer</span><h1>Friend requests</h1><p>New connections start with a hello. Manage your invitations here.</p></div><div id="inbox-messages" aria-live="polite">
        <div class="loading">Loading friend requests</div>
    </div></main>


    <script>
        // Initialize Firebase
        // Load environment variables for security
        window.env = window.env || {
            VITE_FIREBASE_API_KEY: "AIzaSyDWpApnJ-mfHQJZhkbNDdsJ7l8-8rVHHTc",
            VITE_FIREBASE_AUTH_DOMAIN: "lyria-49a54.firebaseapp.com",
            VITE_FIREBASE_PROJECT_ID: "lyria-49a54",
            VITE_FIREBASE_STORAGE_BUCKET: "lyria-49a54.firebasestorage.app",
            VITE_FIREBASE_MESSAGING_SENDER_ID: "704449928785",
            VITE_FIREBASE_APP_ID: "1:704449928785:web:5b3c58c8f82d31d3f1a270",
            VITE_FIREBASE_MEASUREMENT_ID: "G-KV5FRFN63T"
        };

        // Initialize Firebase for inbox
        function initializeInboxFirebase() {
            if (window.firebaseConfig && window.firebaseConfig.initialized) {
                return {
                    auth: window.firebaseConfig.getAuth(),
                    db: window.firebaseConfig.getFirestore()
                };
            }

            // If config is available but not initialized, initialize it
            if (window.firebaseConfig) {
                window.firebaseConfig.initialize();
                return {
                    auth: window.firebaseConfig.getAuth(),
                    db: window.firebaseConfig.getFirestore()
                };
            }

            // Fallback: initialize directly if config.js wasn't loaded
            const fallbackConfig = {
                apiKey: window.env.VITE_FIREBASE_API_KEY,
                authDomain: window.env.VITE_FIREBASE_AUTH_DOMAIN,
                projectId: window.env.VITE_FIREBASE_PROJECT_ID,
                storageBucket: window.env.VITE_FIREBASE_STORAGE_BUCKET,
                messagingSenderId: window.env.VITE_FIREBASE_MESSAGING_SENDER_ID,
                appId: window.env.VITE_FIREBASE_APP_ID,
                measurementId: window.env.VITE_FIREBASE_MEASUREMENT_ID
            };
            firebase.initializeApp(fallbackConfig);
            return {
                auth: firebase.auth(),
                db: firebase.firestore()
            };
        }

        const { auth, db } = initializeInboxFirebase();

        /**
         * Load and display friend requests for the logged-in user.
         */
        async function loadFriendRequests() {
            const inboxContainer = document.getElementById("inbox-messages");
            inboxContainer.innerHTML = '<div class="loading">Loading friend requests</div>';

            try {
                // Get current user
                const user = auth.currentUser;
                if (!user) {
                    // Wait for auth state to initialize
                    await new Promise(resolve => {
                        const unsubscribe = auth.onAuthStateChanged(user => {
                            unsubscribe();
                            resolve(user);
                        });
                    });
                }

                const userId = auth.currentUser?.uid;
                if (!userId) {
                    window.location.href = '/login.html';
                    return;
                }

                // Real-time listener for friend requests and accepted requests
                const unsubscribe = db.collection("friendRequests")
                    .where("to", "in", [userId, "accepted_" + userId])
                    .onSnapshot(async (snapshot) => {
                        inboxContainer.innerHTML = "";

                        if (snapshot.empty) {
                            inboxContainer.innerHTML = '<div class="empty-state"><span class="empty-icon">'+window.LyriaUI.icon('inbox')+'</span><h2>You’re all caught up.</h2><p>New friend requests will appear here. Head back to the community to meet your people.</p><a class="button button-quiet button-small" href="home.html">Back to community</a></div>';
                            return;
                        }

                        const requests = [];
                        for (const doc of snapshot.docs) {
                            const request = doc.data();
                            // Fetch sender's latest profile info
                            try {
                                const senderDoc = await db.collection("users").doc(request.from).get();
                                const senderData = senderDoc.data();
                                request.fromName = senderData?.displayName || "Unknown User";
                            } catch (error) {
                                console.error("Error fetching sender data:", error);
                                request.fromName = "Unknown User";
                            }
                            requests.push({ id: doc.id, ...request });
                        }

                        requests.forEach(request => {
                            const messageElement = document.createElement("div");
                            messageElement.className = "inbox-message";

                            const messageText = document.createElement("div");
                            if (request.to === userId) {
                                messageText.textContent = `${request.fromName} sent you a friend request!`;

                                const actions = document.createElement("div");
                                actions.className = "friend-request-actions";

                                const acceptButton = document.createElement("button");
                                acceptButton.className = "accept-btn";
                                acceptButton.textContent = "Accept";
                                acceptButton.onclick = () => handleFriendRequest(request.id, "accept", request.from, userId);

                                const declineButton = document.createElement("button");
                                declineButton.className = "decline-btn";
                                declineButton.textContent = "Decline";
                                declineButton.onclick = () => handleFriendRequest(request.id, "decline", request.from, userId);

                                actions.appendChild(acceptButton);
                                actions.appendChild(declineButton);
                                messageElement.appendChild(actions);
                            } else {
                                messageText.textContent = `${request.fromName} accepted your friend request!`;
                            }

                            messageElement.appendChild(messageText);
                            inboxContainer.appendChild(messageElement);
                        });
                    }, error => {
                        console.error("Error in real-time listener:", error);
                        showError("Error loading friend requests. Please refresh the page.");
                    });

                // Clean up listener when page is closed
                window.addEventListener('unload', () => unsubscribe());

            } catch (error) {
                console.error("Error loading friend requests:", error);
                showError("Error loading friend requests. Please try again later.");
            }
        }

        /**
         * Display error message to user
         * @param {string} message - Error message to display
         */
        function showError(message) {
            const inboxContainer = document.getElementById("inbox-messages");
            inboxContainer.innerHTML = `<div class="error-message">${message}</div>`;
        }

        /**
         * Handle friend request actions: accept or decline.
         * @param {string} requestId - The ID of the friend request document
         * @param {string} action - The action to take ('accept' or 'decline')
         * @param {string} senderId - The user ID of the friend request sender
         * @param {string} userId - The user ID of the request recipient
         */
        async function handleFriendRequest(requestId, action, senderId, userId) {
            const actionButtons = document.querySelectorAll(`button[onclick*="${requestId}"]`);
            actionButtons.forEach(btn => btn.disabled = true);

            try {
                if (action === "accept") {
                    // Start a batch write
                    const batch = db.batch();

                    // Add each other as friends
                    batch.update(db.collection("users").doc(userId), {
                        friends: firebase.firestore.FieldValue.arrayUnion(senderId),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    batch.update(db.collection("users").doc(senderId), {
                        friends: firebase.firestore.FieldValue.arrayUnion(userId),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    // Update the friend request to show it's accepted
                    batch.update(db.collection("friendRequests").doc(requestId), {
                        to: "accepted_" + senderId,
                        acceptedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    // Commit the batch
                    await batch.commit();

                    // Create notification for sender
                    await db.collection("notifications").add({
                        userId: senderId,
                        type: "friend_request_accepted",
                        message: "Your friend request was accepted!",
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        read: false
                    });

                } else if (action === "decline") {
                    await db.collection("friendRequests").doc(requestId).delete();
                }

            } catch (error) {
                console.error("Error handling friend request:", error);
                showError("Error processing request. Please try again.");
                actionButtons.forEach(btn => btn.disabled = false);
            }
        }

        // Load friend requests when page loads
        document.addEventListener('DOMContentLoaded', loadFriendRequests);


    </script>
</body>
</html>
